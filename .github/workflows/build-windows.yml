name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller customtkinter
        
    - name: Install Inno Setup
      run: choco install innosetup -y
        
    - name: Build with PyInstaller
      shell: powershell
      run: |
        $ctk_path = (python -c "import customtkinter; import os; print(os.path.dirname(customtkinter.__file__))")
        pyinstaller `
          --noconfirm --onedir --windowed --uac-admin `
          --name HotZonePro `
          --icon=hotzone.ico `
          --add-data "static;static" `
          --add-data "hotzone-admin.html;." `
          --add-data "$($ctk_path);customtkinter" `
          --hidden-import "dnslib" `
          --hidden-import "PIL._tkinter_finder" `
          --collect-all uvicorn `
          --collect-all fastapi `
          gui.py
          
    - name: Compile Windows Installer (Inno Setup)
      shell: pwsh
      run: |
        iscc installer.iss
        
    - name: Upload Installer to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-build
        name: Latest Windows Installer
        body: "Automatically generated Windows setup installer for HotZone Pro. Download and run HotZonePro_Setup.exe to install."
        prerelease: true
        files: Output/HotZonePro_Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload Installer as Artifact
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: HotZonePro-Setup
        path: Output/HotZonePro_Setup.exe
        retention-days: 1

