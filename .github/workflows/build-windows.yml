name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller customtkinter
        
    - name: Install Playwright Browsers
      run: |
        playwright install chromium
        
    - name: Resolve Playwright paths
      id: pw_paths
      shell: powershell
      run: |
        # Get the Playwright driver directory
        $pw_driver = python -c "import playwright, os; print(os.path.join(os.path.dirname(playwright.__file__), 'driver'))"
        echo "PW_DRIVER=$pw_driver" >> $env:GITHUB_OUTPUT
        echo "Playwright driver: $pw_driver"
        
        # Get the browser cache directory (Windows: %LOCALAPPDATA%\ms-playwright)
        $browsers_cache = "$env:LOCALAPPDATA\ms-playwright"
        echo "Browser cache: $browsers_cache"
        
        # List ALL browser directories for diagnostics
        Get-ChildItem -Path $browsers_cache -Directory | ForEach-Object { echo "  Found: $($_.Name)" }
        
        # Collect all chromium directories (full + headless shell)
        $all_dirs = Get-ChildItem -Path $browsers_cache -Filter "chromium*" -Directory
        
        if ($all_dirs.Count -eq 0) {
          Write-Error "Could not find any chromium directories in $browsers_cache"
          exit 1
        }
        
        # Build semicolon-separated list of "source|destname" pairs
        $pairs = @()
        foreach ($dir in $all_dirs) {
          $pairs += "$($dir.FullName)|$($dir.Name)"
          echo "Will bundle: $($dir.Name) from $($dir.FullName)"
        }
        $pairsStr = $pairs -join ";"
        echo "BROWSER_PAIRS=$pairsStr" >> $env:GITHUB_OUTPUT
        
    - name: Build with PyInstaller
      shell: powershell
      run: |
        $pw_driver = "${{ steps.pw_paths.outputs.PW_DRIVER }}"
        $pairsStr = "${{ steps.pw_paths.outputs.BROWSER_PAIRS }}"
        
        # Start building the pyinstaller command with base args
        $pyiArgs = @(
          "--noconfirm", "--onedir", "--windowed",
          "--name", "HotZonePro",
          "--icon=hotzone.ico",
          "--add-data", "static;static",
          "--add-data", "hotzone-admin.html;.",
          "--add-data", "${pw_driver};playwright\driver"
        )
        
        # Add each browser directory
        foreach ($pair in $pairsStr.Split(";")) {
          $parts = $pair.Split("|")
          $src = $parts[0]
          $name = $parts[1]
          $dest = "playwright\driver\package\.local-browsers\$name"
          $pyiArgs += "--add-data"
          $pyiArgs += "${src};${dest}"
          echo "Adding browser: $name -> $dest"
        }
        
        $pyiArgs += "gui.py"
        
        echo "Running: pyinstaller $($pyiArgs -join ' ')"
        & pyinstaller @pyiArgs
          
    - name: Compile Windows Installer (Inno Setup)
      shell: pwsh
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        
    - name: Upload Installer to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest-build
        name: 🚀 Latest Windows Installer
        body: "Automatically generated Windows setup installer for HotZone Pro. Download and run `HotZonePro_Setup.exe` to install."
        prerelease: true
        files: Output/HotZonePro_Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload Installer as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HotZonePro-Setup
        path: Output/HotZonePro_Setup.exe
